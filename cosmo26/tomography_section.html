<!-- =========================================================================
     Tomography explainer — drop-in reveal.js <section>
     -------------------------------------------------------------------------
     Justine Zeghal's 9-frame tomography build, revealed one frame per click on
     a BLACK background (the frames are flattened on black, so the section must
     be black). To use:
       <head>:  <link rel="stylesheet" href="tomography.css">
     No JS needed (reveal fragments handle the crossfade). Needs
     assets/tomography/01..09.png. Frame 1 is the default; the eight .fragment
     frames step on. Credit line required by the source.
========================================================================== -->
<section class="tomo-slide" data-background-color="#000000">
  <div class="tomo-stage">
    <img class="tomo-frame"                  src="../assets/diagrams/tomography/tomo_1.png" alt="tomography frame 1">
    <img class="tomo-frame stacked fragment" src="../assets/diagrams/tomography/tomo_2.png" alt="tomography frame 2">
    <img class="tomo-frame stacked fragment" src="../assets/diagrams/tomography/tomo_3.png" alt="tomography frame 3">
    <img class="tomo-frame stacked fragment" src="../assets/diagrams/tomography/tomo_4.png" alt="tomography frame 4">
    <img class="tomo-frame stacked fragment" src="../assets/diagrams/tomography/tomo_5.png" alt="tomography frame 5">
    <img class="tomo-frame stacked fragment" src="../assets/diagrams/tomography/tomo_6.png" alt="tomography frame 6">
    <img class="tomo-frame stacked fragment" src="../assets/diagrams/tomography/tomo_7.png" alt="tomography frame 7">
    <img class="tomo-frame stacked fragment" src="../assets/diagrams/tomography/tomo_8.png" alt="tomography frame 8">
    <img class="tomo-frame stacked fragment" src="../assets/diagrams/tomography/tomo_9.png" alt="tomography frame 9">
  </div>
  <div class="tomo-credit">Credit: Justine Zeghal</div>
</section>
