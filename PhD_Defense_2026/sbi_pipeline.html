<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SBI pipeline explainer — The Non-Gaussian Universe</title>
  <link rel="stylesheet" href="vendor/reveal/dist/reveal.css">
  <link rel="stylesheet" href="vendor/reveal/dist/theme/white.css">
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="sbi_pipeline.css">
</head>
<body>
  <div class="reveal">
    <div class="slides">

      <section class="sbi-slide" data-sbi-explainer>
        <h3 class="sbi-title">The inference pipeline:
          <span class="hl">neural posterior estimation</span></h3>

        <div class="sbi-stage">
          <canvas class="sbi-canvas" width="2360" height="1104"
            aria-label="The SBI pipeline assembling: cosmoGRID kappa-maps, plus noise and a wavelet transform into wavelet-scale maps and summary statistics, conditioning a conditional MAF that maps a Gaussian into the posterior"></canvas>

          <!-- real map figures -->
          <img class="sbi-img" data-appear="1" src="../assets/diagrams/cosmogrid_box.png"
               alt="cosmoGRID kappa-maps" style="left:10.5%; top:65%; width:15%;">
          <img class="sbi-img" data-appear="2" src="../assets/diagrams/wavelet_scales_stats.png"
               alt="wavelet-scale maps and summary statistics" style="left:46%; top:66%; width:46%;">

          <!-- forward-model label -->
          <div class="sbi-lbl sbi-lbl--mut" data-appear="2" style="left:20.5%; top:55%;">+ noise<br>wavelet transform</div>

          <!-- inference -->
          <div class="sbi-lbl sbi-lbl--cond" data-appear="3" style="left:70%; top:56%;">condition</div>
          <div class="sbi-lbl sbi-lbl--head" data-appear="3" style="left:15%; top:5%;">Gaussian<span class="sub">\(\mathcal{N}(0,\mathbf{1})\)</span></div>
          <div class="sbi-lbl sbi-lbl--head" data-appear="3" style="left:40%; top:5%;">Density estimator<span class="sub">conditional MAF</span></div>
          <div class="sbi-lbl sbi-lbl--head" data-appear="4" style="left:62%; top:5%;">Posterior<span class="sub">\(p(\theta\mid x)\)</span></div>

          <!-- objective -->
          <div class="sbi-lbl sbi-lbl--obj" data-appear="5" style="left:91.5%; top:40%;">
            <div class="ot">training objective</div>\(\mathcal{L}=-\log p_\phi(\theta\mid x)\)</div>
          <img class="sbi-img" data-appear="5" src="../assets/logos/jax_logo.png" alt="JAX" style="left:91.5%; top:52%; width:7.5%;">
        </div>

        <div class="sbi-caption" aria-live="polite"></div>
        <button class="sbi-replay" type="button" title="Replay (R)">↻&nbsp;replay</button>
        <span class="fragment sbi-frag" aria-hidden="true"></span>
        <span class="fragment sbi-frag" aria-hidden="true"></span>
        <span class="fragment sbi-frag" aria-hidden="true"></span>
        <span class="fragment sbi-frag" aria-hidden="true"></span>
      </section>

    </div>
  </div>

  <script src="vendor/reveal/dist/reveal.js"></script>
  <script src="vendor/katex/katex.min.js"></script>
  <script src="vendor/katex/contrib/auto-render.min.js"></script>
  <script src="sbi_pipeline.js"></script>
  <script>
    Reveal.initialize({
      hash: true, controls: true, progress: true, slideNumber: false,
      transition: 'fade', width: 1280, height: 720, margin: 0.04,
      minScale: 0.2, maxScale: 2.0
    });
    SBIPipeline.attach(Reveal);
  </script>
</body>
</html>
